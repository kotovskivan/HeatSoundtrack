<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heat Soundtrack</title>
<link rel="icon" type="image/png" sizes="16x16" href="img/icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="img/icon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="icon" type="image/png" sizes="256x256" href="img/icon-256.png">
<link rel="stylesheet" href="dialog.css">
<style>
:root {
  /* цвета Heat — из палитры игры (ui/core/colors), сверено со скринами Вани 13.11: --acid = маджента #ff0080 («Heat» в логотипе), --sun = желтый (деньги / NEW),
     --paper = Light Base (выбранное), --mine = циан («ты» — свои песни, как свой ник в гонке); имя --acid осталось от Unbound */
  --acid: #ff0080; --acid-dim: #b0005a; --sun: #ffff00; --ink: #191919; --paper: #f1f8fc; --mute: #8d8d99; --mine: #00ffff;
  --line: rgba(255,255,255,.14);
  /* где играет — как точки событий на карте игры: день — циан, ночь — маджента; гараж — фиолет (ActivitiesCheckpoints); город и гонку различает значок */
  --c-garage: #9f4cff; --c-cityDay: #00ffff; --c-cityNight: #ff0080; --c-raceDay: #00ffff; --c-raceNight: #ff0080;
  --font: "Bahnschrift", "DIN Alternate", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
/* у Bahnschrift нет иероглифов: латиница — Bahnschrift, остальное — шрифт Windows для языка (lang="zh-Hans" / "ja" / "ko" ставит applyI18n) */
:lang(zh) { --font: "Bahnschrift", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
:lang(ja) { --font: "Bahnschrift", "Yu Gothic UI", "Meiryo UI", "Meiryo", sans-serif; }
:lang(ko) { --font: "Bahnschrift", "Malgun Gothic", sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0b0a12; color: var(--paper); font-family: var(--font); overflow: hidden; }
body { font-variation-settings: "wdth" 85, "wght" 500; }

/* ---------- фон: слои как в меню гаража (картинки берутся из игры игрока при первом запуске) ---------- */
.bg, .bg > div { position: fixed; inset: 0; pointer-events: none; }
.bg { background: radial-gradient(ellipse at 72% 28%, rgba(255,45,123,.16) 0%, transparent 55%), radial-gradient(ellipse at 10% 90%, rgba(91,60,255,.14) 0%, transparent 50%), #0b0a12; }  /* пока нет фонов из игры */
/* Heat: фон — скрин Вани из игры (img/bg.jpg: Evo в неоновой арке, фоторежим, 13.11); --photo из игры остается только для «Подяк».
   leak (фиолетовая засветка) и logo (повернутый логотип — прием Unbound) выключены: Ваня, 13.11 — «элементы Unbound не работают» */
.bg .photo { background: url("img/bg.jpg") center/cover; filter: brightness(.8) contrast(1.05); transform: scale(1.06); animation: drift 40s ease-in-out infinite alternate; }
.bg .leak { display: none; }
.bg .shade { background: linear-gradient(90deg, rgba(8,6,18,.92) 0%, rgba(10,6,24,.5) 30%, rgba(10,6,24,.18) 100%); }
.bg .logo { display: none; }
.bg .halftone { background: var(--halftone, none) repeat; background-size: 520px; opacity: .10; mix-blend-mode: screen; -webkit-mask-image: linear-gradient(115deg, #000 0%, transparent 55%); mask-image: linear-gradient(115deg, #000 0%, transparent 55%); }
.bg .dots { background: var(--dots, none) repeat; background-size: 640px; opacity: .20; }
.bg .grunge { background: var(--grunge, none) repeat; background-size: 900px; opacity: .10; mix-blend-mode: screen; }
.bg .noise { background: var(--noise, none) repeat; background-size: 1400px; opacity: .10; animation: grain .6s steps(3) infinite; }
.bg .vig { background: radial-gradient(ellipse at 60% 50%, transparent 40%, rgba(0,0,0,.75) 100%); }
@keyframes drift { from { transform: scale(1.06) translateX(0); } to { transform: scale(1.1) translateX(-30px); } }
@keyframes grain { 0% { background-position: 0 0; } 33% { background-position: -230px 120px; } 66% { background-position: 170px -90px; } }
@media (prefers-reduced-motion: reduce) { .bg .photo, .bg .noise { animation: none; } }

.ghost { position: fixed; top: 4vh; left: -2vw; font-size: 21vh; line-height: .82; font-weight: 700; font-variation-settings: "wdth" 75, "wght" 700;
  color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.10); text-transform: uppercase; white-space: nowrap; display: none; pointer-events: none; user-select: none; }
.ghost span { display: block; }
.ghost span:nth-child(2) { margin-left: 22vw; -webkit-text-stroke-color: rgba(255,255,255,.06); }

/* ---------- раскладка ---------- */
.app { position: relative; z-index: 2; display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
.side { padding: 34px 0 28px 38px; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
.tag { align-self: flex-start; color: rgba(241,248,252,.72); font-size: 13px; letter-spacing: .32em; font-variation-settings: "wdth" 100, "wght" 700; font-style: italic; }
.tag b { display: inline-block; }
@font-face { font-family: "Mr Dafoe"; src: url("fonts/MrDafoe-Regular.ttf") format("truetype"); font-display: block; }   /* подпись кистью — SIL OFL 1.1 (fonts/OFL.txt), только латиница */
.brand { position: relative; height: 132px; margin-top: 2px; }
.brand b { display: block; font-size: 96px; line-height: .9; font-weight: 700; font-stretch: 75%; font-variation-settings: "wdth" 75, "wght" 700; font-style: italic; color: var(--paper); text-shadow: 0 2px 14px rgba(0,0,0,.55); }
.brand i { position: absolute; left: 34px; top: 44px; font-family: "Mr Dafoe", cursive; font-style: normal; font-size: 56px; line-height: 1; white-space: nowrap; color: var(--acid);
  transform: rotate(-7deg); transform-origin: left center; text-shadow: 0 0 4px rgba(255,0,128,.9), 0 0 16px rgba(255,0,128,.55), 0 0 34px rgba(255,0,128,.3); }
.title { margin-top: 10px; font-size: 15px; line-height: 1.2; white-space: nowrap; text-transform: uppercase; letter-spacing: .3em; font-variation-settings: "wdth" 100, "wght" 700; font-style: italic; color: rgba(241,248,252,.82); }
.title em { font-style: italic; color: var(--acid); }

.menu { margin-top: 26px; width: 262px; list-style: none; }
.menu li { position: relative; cursor: pointer; margin: 0 0 4px; background: rgba(13,13,13,.72); transition: background .12s; }
.menu li:not(.on):hover { background: rgba(44,44,52,.85); }
.menu .item { display: flex; align-items: baseline; white-space: nowrap; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; font-variation-settings: "wdth" 80, "wght" 700;
  padding: 8px 14px 5px; font-style: italic; color: #f1f8fc; text-shadow: 0 2px 8px rgba(0,0,0,.8); transition: color .12s; }
.menu .cnt { font-size: 15px; color: var(--mute); margin-left: auto; padding-left: 10px; font-variation-settings: "wdth" 100, "wght" 500; }
.menu .new { position: absolute; top: 0; right: 0; background: #ffff00; color: #000; font-style: italic; font-size: 11px; padding: 2px 6px; letter-spacing: .08em; font-variation-settings: "wdth" 100, "wght" 700; }
.menu li.on { background: #f1f8fc; }
.menu li.on .item { color: #191919; text-shadow: none; }
.menu li.on .cnt { color: #555; }
.menu .sub { display: none; padding: 0 14px 8px; color: #3a3a40; font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; font-variation-settings: "wdth" 100, "wght" 500; }
.menu li.on .sub { display: block; }
/* «Без диктора» (Ваня 15.11): обычный пункт меню, справа галочка — пустой квадрат / зеленый с галочкой */
.menu .chk { margin-left: auto; align-self: center; flex: none; width: 20px; height: 20px; box-sizing: border-box; border: 2px solid rgba(241,248,252,.7);
  display: flex; align-items: center; justify-content: center; transition: background .12s, border-color .12s; }
.menu .chk svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 3.4; visibility: hidden; }
.menu .chk.on { background: #1fd65f; border-color: #1fd65f; box-shadow: 0 0 8px rgba(31,214,95,.55); }
.menu .chk.on svg { visibility: visible; }
.menu li[data-f="mute"] .item > span:first-child { padding-right: 12px; }
/* 18.11 Ваня: «правильно описать, что делает эта кнопка — внизу под кнопкой текстом»: «Без диктора» — не раздел (не бывает .on), подпись видна всегда */
.menu li[data-f="mute"] .sub { display: block; color: rgba(241,248,252,.55); }

/* слева: сколько играет в каждом из 5 мест (треки игры + свои песни), полоска цвета места */
.stats { margin-top: 24px; width: 250px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.stats .st { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.stats .st svg { height: 12px; width: auto; flex: none; align-self: center; fill: var(--cc); }
.stats .st span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats b { color: var(--paper); font-size: 17px; font-weight: normal; font-variation-settings: "wdth" 80, "wght" 700; letter-spacing: 0; }
.stats .bar { height: 3px; background: rgba(255,255,255,.12); margin-top: 3px; }
.stats .bar i { display: block; height: 100%; background: var(--cc); }

/* ---------- профили (левая колонка) ---------- */
.prof { margin-top: 26px; width: 270px; }
.prof-list { display: flex; flex-direction: column; gap: 6px; max-height: 168px; overflow-y: auto; padding: 2px 8px 4px 2px; }
.prof-list::-webkit-scrollbar { width: 4px; } .prof-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); }
.pf { display: flex; align-items: center; gap: 6px; padding: 6px 10px 5px; border: 1px solid var(--line); background: rgba(0,0,0,.5); cursor: pointer;
  font-style: italic; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; font-variation-settings: "wdth" 85, "wght" 700; color: #d8d8d2; }
.pf:hover { border-color: var(--paper); color: #fff; }
.pf .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pf.on { background: #f1f8fc; border-color: #f1f8fc; color: #191919; cursor: default; }   /* выбранное в Heat — светлая плашка */
.pf button { background: none; border: 0; color: inherit; font-size: 14px; cursor: pointer; padding: 0 3px; opacity: .65; }
.pf button:hover { opacity: 1; }
.pf-new { margin-top: 8px; background: none; border: 1px solid rgba(255,45,123,.55); color: var(--acid); font: inherit; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  padding: 6px 12px; cursor: pointer; font-style: italic; font-variation-settings: "wdth" 100, "wght" 700; }
.pf-new:hover { background: rgba(255,45,123,.1); }
/* ---------- разделы сетки ---------- */
.sep { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin: 6px 0 -4px; }
.sep b { font-size: 22px; line-height: 1; text-transform: uppercase; font-weight: normal; font-variation-settings: "wdth" 78, "wght" 700; font-style: italic; letter-spacing: .02em;
  padding: 7px 46px 5px 14px; background: linear-gradient(90deg, rgba(49,0,255,.85), rgba(49,0,255,0)); border-left: 3px solid var(--mine); }
.sep i { font-style: italic; background: var(--sun); color: #000; font-size: 12px; padding: 2px 7px; font-variation-settings: "wdth" 100, "wght" 700; }
.sep::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.14); }
.sep.game i { background: var(--sun); }
.sep .mbtn { order: 3; font: inherit; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--line); color: var(--mute); background: rgba(0,0,0,.5); cursor: pointer; font-style: italic; font-variation-settings: "wdth" 100, "wght" 700; }
.sep .mbtn:hover { color: var(--ink); background: var(--paper); border-color: var(--paper); }
.sep.game::after { background: rgba(255,255,255,.14); }
/* группа треков игры по месту: значок, имя и счетчик «вкл N из M» цветом места; все выключено и своих нет — оранжевая подсказка */
.sep.ctx { margin: 6px 0 -2px; gap: 0; }   /* 17.11 ночь: содержимое — в плашке .pl (ниже, у стрелки), дальше линия */
.sep.ctx svg { height: 16px; width: auto; flex: none; fill: var(--cc); }
.sep.ctx b { font-size: 18px; color: var(--cc); padding: 0; background: none; border: 0; }
.sep.ctx i { background: var(--cc); border: 0; color: #000; }   /* 17.11 ночь: счетчик — залитый бейдж цвета места, как желтый у «Мої пісні» */
.sep.ctx::after { background: linear-gradient(90deg, color-mix(in srgb, var(--cc) 55%, transparent), rgba(255,255,255,.04)); }
/* 17.11: «+» у раздела места своих песен; ночью — отсек справа в плашке, за чертой, сразу за счетчиком */
.sep .madd { order: 0; align-self: stretch; display: inline-flex; align-items: center; margin-left: 4px; padding: 0 14px; font-size: 20px; line-height: 1; font-style: normal; letter-spacing: 0;
  color: var(--cc); background: none; border: 0; border-left: .1px solid var(--cc); }
.sep .madd:hover { color: var(--ink); background: var(--cc); border-color: var(--cc); }
/* окно «+»: все свои песни строками, галочка зеленая (как «Без диктора») = играет в этом месте */
.dlg-pick .dlg-text { max-height: none; overflow: visible; padding-right: 0; }
.dlg-pick .pk-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 2px 0 10px; }
.dlg-pick .pk-q { flex: 1; min-width: 200px; max-width: 560px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18); color: #f2f0f5; font: inherit; font-size: .8em; padding: 8px 10px; outline: none; }
.dlg-pick .pk-q:focus { border-color: #00ffff; }
.dlg-pick .pk-all { background: rgba(6,5,12,.8); color: #f1f8fc; border: 0; font: inherit; font-size: .72em; padding: 9px 14px; cursor: pointer; text-transform: uppercase; font-style: italic; font-variation-settings: "wdth" 75, "wght" 700; }
.dlg-pick .pk-all:hover { background: #f1f8fc; color: #191919; }
.dlg-pick .pk-n { margin-left: 4px; color: #9d9aa6; font-size: .72em; }
.dlg-pick .pk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px; max-height: 50vh; overflow-y: auto; padding-right: 6px; }
.dlg-pick .pk-list::-webkit-scrollbar { width: 6px; } .dlg-pick .pk-list::-webkit-scrollbar-thumb { background: #3a3a42; }
.dlg-pick .pk-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: rgba(6,5,12,.72); border-left: 3px solid transparent; cursor: pointer; }
.dlg-pick .pk-row:hover { background: rgba(255,255,255,.08); }
.dlg-pick .pk-row:has(input:checked) { border-left-color: #00ffff; background: rgba(0,255,255,.07); }
.dlg-pick .pk-row[hidden] { display: none; }
.dlg-pick .pk-row input { flex: none; width: 20px; height: 20px; margin: 0; accent-color: #1fd65f; cursor: pointer; }
.dlg-pick .pk-row img, .dlg-pick .pk-na { flex: none; width: 40px; height: 40px; object-fit: cover; background: #22202c; display: grid; place-items: center; color: #ff0080; }
.dlg-pick .pk-m { min-width: 0; line-height: 1.2; }
.dlg-pick .pk-m b { display: block; font-size: .78em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dlg-pick .pk-m i { display: block; font-style: normal; font-size: .6em; color: #9d9aa6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 17.11: свернуть раздел — клик по заголовку. Ночью (Ваня выбрал на dizajn/pravka-svorachivanie): стрелка нарисована (SVG), без рамки, первой;
   › свернут, ˅ развернут. Заголовок места — черная плашка-ярлык [▌› значок ИМЯ ▇N▇ | +], рамка 0.1px цветом места (= 1 пиксель экрана) */
.sep[data-fold] { cursor: pointer; user-select: none; }
.sep .fold { flex: none; display: inline-flex; width: 12px; font-size: 0; color: var(--cc); opacity: .8; }
.sep .fold svg { display: block; width: 12px; height: 12px; transform: rotate(90deg); transition: transform .15s; }
.sep.folded .fold svg { transform: none; }
.sep[data-fold]:hover .fold { opacity: 1; }
.sep:not(.ctx) b .fold { vertical-align: 2px; margin-right: 12px; color: var(--paper); opacity: .85; }   /* «Мої пісні» / «Треки гри»: синяя плашка как была, стрелка — первой внутри */
.sep.ctx .pl { display: inline-flex; align-items: center; gap: 10px; height: 34px; padding-left: 10px; background: rgba(0,0,0,.85);
  border: .1px solid var(--cc); border-left: 3px solid var(--cc); transition: background .12s; }   /* черный задник — текст не сливается с машиной на фоне (Ваня) */
.sep.ctx .pl:not(:has(.madd)) { padding-right: 14px; }
.sep.ctx[data-fold]:hover:not(:has(.mbtn:hover)) .pl { background: color-mix(in srgb, var(--cc) 14%, rgba(0,0,0,.85)); }
.sep.ctx .cw { margin-left: 10px; }
.sep .cw { order: 4; font-style: normal; font-size: 11px; letter-spacing: .06em; color: var(--sun); white-space: nowrap; }

/* ---------- авторы (низ левой колонки) ---------- */
.credits { margin-top: auto; padding-top: 24px; width: 270px; }
.cr-h { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); margin-bottom: 10px; font-variation-settings: "wdth" 100, "wght" 600; }
.cr { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--paper); padding: 7px 14px 7px 7px; margin-bottom: 10px;
  background: rgba(0,0,0,.55); border: 1px solid var(--line); transition: border-color .12s, box-shadow .12s; }
.cr:hover { border-color: var(--acid); box-shadow: 0 0 18px rgba(255,45,123,.25); }
.cr .ic { flex: none; width: 46px; height: 46px; display: grid; place-items: center; }
.cr .ic svg { width: 38px; height: 38px; }
.cr .ic.claude { background: #f0eee6; }
.cr .ic.cat { background: var(--acid); }
.cr b { display: block; font-size: 21px; line-height: 1; text-transform: uppercase; font-weight: normal; font-variation-settings: "wdth" 78, "wght" 700; letter-spacing: .02em; }
.cr i { display: block; margin-top: 4px; font-style: normal; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); font-variation-settings: "wdth" 100, "wght" 600; }
.cr:hover i { color: var(--acid); }
.foot { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
.foot .brk { flex-basis: 100%; height: 0; margin: -7px 0; }   /* перенос строки внутри .foot */
.foot-l { display: inline-block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute);   /* как .frosty: тот же наклон и рамка — иначе съезжает */
  font-style: italic; font-variation-settings: "wdth" 100, "wght" 600; border-bottom: 1px solid transparent;
  flex-basis: 100%; margin-bottom: -8px; }   /* подпись своей строкой над ссылками: в одну строку с YouTube не влезает в 340px */
.frosty { display: inline-block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); text-decoration: none; cursor: pointer; background: none; border: 0; font-family: inherit;
  font-style: italic; font-variation-settings: "wdth" 100, "wght" 600; border-bottom: 1px solid transparent; }
.frosty b { color: var(--paper); font-weight: normal; font-variation-settings: "wdth" 100, "wght" 700; }
.frosty:hover { color: var(--acid); border-bottom-color: var(--acid); }
/* LOG — кнопка, а не ссылка: у кнопки свои отступы и высота строки → стояла выше соседей и серой (Ваня 15.11, как в Unbound 1.0.3) */
button.frosty { padding: 0; margin: 0; line-height: inherit; }
.foot { align-items: baseline; }   /* по линии текста: у ссылок ↗ из запасного шрифта делает строку выше, кнопка LOG центрует текст */
/* версия возле заголовка (Ваня 15.11, как в Unbound 1.0.3) — тихая, как подписи низа */
.title .ver { margin-left: 10px; padding: 1px 5px; border: 1px solid var(--line); font-size: 10px; letter-spacing: .12em; color: var(--mute);
  vertical-align: 2px; text-transform: none; font-variation-settings: "wdth" 100, "wght" 600; }
.title .ver:empty { display: none; }
/* плитка хаба NFS Own Music (Ваня 15.11: «как наши плитки разработчиков», как в Unbound 1.0.3) — плитка .cr в стиле Heat (без подложки); нота хаба на оранжевом */
.hub { margin-bottom: 22px; }
.cr .ic.own { background: #ff5a1f; }
.cr .ic.own svg { width: 30px; height: 30px; }
.hub b span { color: #ff5a1f; }

/* ---------- правая часть ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; padding: 44px 34px 0 10px; }
.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.search { flex: 0 1 360px; position: relative; }
.search input { width: 100%; background: rgba(0,0,0,.55); border: 1px solid var(--line); color: var(--paper); font: inherit; font-size: 16px; padding: 10px 14px; outline: none; letter-spacing: .04em; }
.search input:focus { border-color: var(--acid); }
.btn { background: rgba(0,0,0,.55); border: 1px solid var(--line); color: var(--paper); font: inherit; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  padding: 11px 16px; cursor: pointer; font-style: italic; font-variation-settings: "wdth" 100, "wght" 600; }
.btn:hover { border-color: var(--paper); }
.btn.go { margin-left: auto; background: var(--paper); color: var(--ink); border-color: var(--paper); font-size: 16px; padding: 12px 26px; }
.btn.go:hover { filter: brightness(1.1); }
.btn:disabled { opacity: .45; cursor: default; }
.tools .addrow { flex-basis: 100%; display: flex; gap: 12px; flex-wrap: wrap; }   /* своя строка: в широком окне не заезжает к поиску и «Увімкнути / Вимкнути всі» */
.btn.addb { display: inline-flex; align-items: center; gap: 9px; }   /* 18.11: «Додати пісню / З YT Music / Зі Spotify» — кнопками в панели, не карточками в сетке */
.btn.addb i { font-style: normal; color: var(--acid); font-size: 17px; line-height: 1; }
.btn.addb.dragto { border-color: var(--paper); background: rgba(255,0,128,.15); }

.legend { margin: 14px 0 0; font-size: 12px; color: var(--mute); letter-spacing: .08em; max-width: 1100px; line-height: 1.45; }
.legend b { color: var(--paper); font-weight: normal; }
/* окно «Як це працює» */
.help h3 { margin: 16px 0 4px; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--acid); font-weight: normal; font-variation-settings: "wdth" 100, "wght" 700; }
.help h3:first-child { margin-top: 0; }
.help p, .help li { line-height: 1.5; }
.help ul, .help ol { margin: 4px 0; padding-left: 20px; }
.help b { color: var(--paper); }

.grid { flex: 1; min-height: 0; overflow-y: auto; margin-top: 14px; padding: 6px 12px 120px 6px; display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 18px; align-content: start; }
/* 17.11 Ваня: «крайне слабо видно бегунок» — было rgba(255,255,255,.18), на светлых полосах фона пропадал: розовый акцент на темной дорожке */
.grid::-webkit-scrollbar { width: 8px; } .grid::-webkit-scrollbar-track { background: rgba(0,0,0,.45); }
.grid::-webkit-scrollbar-thumb { background: var(--acid); } .grid::-webkit-scrollbar-thumb:hover { background: #ff4da6; }

.card { position: relative; background: rgba(13,13,13,.8); border: 1px solid rgba(255,255,255,.08); cursor: pointer; transition: transform .14s, border-color .14s, opacity .2s, filter .2s; }
.card:hover { border-color: rgba(241,248,252,.7); }
.card .art { position: relative; aspect-ratio: 1; overflow: hidden; background: #141418; }
.card .art img { width: 100%; height: 100%; display: block; object-fit: cover; transition: filter .2s; }
.card .art::after { content: ""; position: absolute; inset: 0; background: var(--dots, none) repeat; background-size: 300px; opacity: .25; mix-blend-mode: overlay; pointer-events: none; }
.card .art .noart { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px; text-align: center; font-size: 22px; line-height: 1; text-transform: uppercase; color: rgba(255,255,255,.3); font-variation-settings: "wdth" 75, "wght" 700; }
/* трек игры: обложек в Heat нет — градиент цвета места, инициалы исполнителя, нота; плитка ниже квадрата (58 треков без лишней прокрутки) */
.card.game .art { aspect-ratio: 16 / 9; }
.card .art .noart.gen { place-items: end start; padding: 8px 12px; font-size: 40px; font-style: italic; color: rgba(241,248,252,.9); text-shadow: 0 2px 10px rgba(0,0,0,.35);
  background: linear-gradient(135deg, color-mix(in srgb, var(--cc) 18%, #18181e) 0%, #0f0f13 75%); box-shadow: inset 0 -2px 0 var(--cc); }
.card .art .noart.gen svg { position: absolute; right: 12px; top: 12px; width: 28px; height: 28px; fill: var(--cc); filter: drop-shadow(0 0 6px var(--cc)); }
.card.off .art .noart.gen { filter: grayscale(1) brightness(.6); }
.card .sw .cx { flex: 1; min-width: 0; padding: 0 4px; }
.card .sw .cx b { overflow: hidden; text-overflow: ellipsis; }
.card .meta { padding: 9px 10px 8px; }
.card .t { font-size: 18px; font-style: italic; line-height: 1.05; text-transform: uppercase; font-variation-settings: "wdth" 78, "wght" 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .a { margin-top: 3px; font-size: 12px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 14px; }
.card .sw { display: flex; gap: 6px; padding: 0 10px 10px; }
.pill { flex: 1; text-align: center; font-size: 11px; letter-spacing: .12em; padding: 5px 0 4px; border: 1px solid rgba(255,255,255,.25); color: var(--mute);
  font-style: italic; font-variation-settings: "wdth" 100, "wght" 700; user-select: none; cursor: pointer; }
.pill.on { background: var(--acid); border-color: var(--acid); color: var(--ink); }
.pill.f.on { background: var(--sun); border-color: var(--sun); }
.pill:hover { border-color: var(--paper); }
.card.off { opacity: .45; }
.card.off .art img { filter: grayscale(1) brightness(.6); }
.card.off .art::before { content: attr(data-off); position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 34px; letter-spacing: .1em;
  color: var(--ink); background: var(--paper); padding: 2px 14px; font-variation-settings: "wdth" 75, "wght" 700; }
.card.half .art::before { content: ""; position: absolute; z-index: 2; right: 8px; top: 8px; width: 12px; height: 12px; background: var(--sun); transform: rotate(45deg); }
.pv { position: absolute; z-index: 3; left: 8px; bottom: 8px; width: 42px; height: 42px; border: none; background: var(--acid); color: var(--ink); font-size: 16px; font-weight: 700;
  cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.4); opacity: 0; transition: opacity .15s; }
.card:hover .pv, .pv.on { opacity: 1; }
.pv.on { background: var(--sun); }
.card .pbar { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 3px; pointer-events: none; }
.card .pbar i { display: block; height: 100%; width: 0; background: var(--sun); }
.ed { position: absolute; z-index: 3; right: 8px; top: 8px; width: 34px; height: 34px; display: grid; place-items: center; border: none; background: var(--paper); color: var(--ink); cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.ed:hover { background: var(--acid); }
.yt { position: absolute; z-index: 3; right: 8px; bottom: 8px; height: 30px; padding: 0 9px; border: none; background: var(--paper); color: var(--ink); font: inherit; font-size: 12px; letter-spacing: .08em;
  cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.4); opacity: 0; transition: opacity .15s; font-variation-settings: "wdth" 100, "wght" 700; }
.card:hover .yt { opacity: 1; }
.yt:hover { background: #ff3b3b; color: #fff; }
.mine-tag { position: absolute; z-index: 3; left: 8px; top: 8px; background: var(--mine); color: #000; font-size: 11px; letter-spacing: .14em; padding: 3px 8px 2px;
  font-style: italic; font-variation-settings: "wdth" 100, "wght" 700; }
.card.mine { border-color: rgba(0,255,255,.4); box-shadow: inset 4px 0 0 var(--mine); }
.card.mine .t { color: var(--mine); }
.card.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 260px; border: 1px solid rgba(255,255,255,.16); background: rgba(13,13,13,.6); text-align: center; padding: 16px; }
.card.add .plus { font-size: 64px; line-height: 1; color: var(--acid); font-variation-settings: "wdth" 75, "wght" 700; }
.card.add b { font-size: 22px; text-transform: uppercase; font-weight: normal; font-variation-settings: "wdth" 78, "wght" 700; }
.card.add span { font-size: 12px; color: var(--mute); letter-spacing: .08em; }
.card.add.dragto, .card.add:hover { border-color: var(--paper); background: rgba(13,13,13,.8); }
.card.add.ytadd .plus { font-size: 46px; padding: 9px 0; }
/* сортировка / фильтры / вид */
.vbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.vbar select { background: rgba(0,0,0,.55); border: 1px solid var(--line); color: var(--paper); font: inherit; font-size: 12px; letter-spacing: .06em; padding: 7px 10px; cursor: pointer; max-width: 280px; }
.vbar select:hover, .vbar select:focus { border-color: var(--acid); outline: none; }
.vbar option { background: #15121f; color: var(--paper); }
.vbar .vt { display: flex; gap: 4px; margin-left: auto; }
.vbar .vt button { width: 36px; height: 32px; display: grid; place-items: center; background: rgba(0,0,0,.55); border: 1px solid var(--line); color: var(--mute); cursor: pointer; }
.vbar .vt button:hover { color: var(--paper); border-color: var(--paper); }
.vbar .vt button.on { background: var(--acid); border-color: var(--acid); color: var(--ink); }
.vbar .vt svg { width: 16px; height: 16px; fill: currentColor; }
/* вид списком: та же карточка строкой */
.grid.list { grid-template-columns: 1fr; gap: 6px; }
/* 17.11 Ваня: «уменьшить иконки, чтоб не ломало интерфейс» — мелкие плитки: обложка, название, значки мест; исполнитель, «СВОЯ», YouTube ↗ — спрятаны */
.grid.small { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.grid.small .card .meta { padding: 5px 6px 4px; }
.grid.small .card .t { font-size: 13px; }
.grid.small .card .a { display: none; }
.grid.small .card .sw { gap: 2px; padding: 0 5px 6px; }
.grid.small .cx { height: 20px; padding: 0 2px; gap: 3px; }
.grid.small .cx svg { height: 11px; }
.grid.small .card.game .cx b { display: none; }
.grid.small .mine-tag, .grid.small .yt { display: none; }
.grid.small .ed { width: 24px; height: 24px; right: 4px; top: 4px; }
.grid.small .ed svg { width: 12px; height: 12px; }
.grid.small .pv { width: 28px; height: 28px; left: 5px; bottom: 5px; font-size: 11px; }
.grid.small .card .art .noart { font-size: 13px; padding: 6px; }
.grid.small .card .art .noart.gen { font-size: 24px; padding: 4px 7px; }
.grid.small .card .art .noart.gen svg { width: 16px; height: 16px; right: 6px; top: 6px; }
.grid.small .card.off .art::before { font-size: 17px; padding: 1px 7px; }
.grid.small .card.half .art::before { width: 8px; height: 8px; right: 5px; top: 5px; }
.grid.small .card.add { min-height: 160px; gap: 4px; padding: 8px; }   /* 17.11 ночь: было 0 — сетка с прокруткой дает ряду только min-height, свернут хаб → ряд из одних «Додати» схлопывался до 18 px */
.grid.small .card.add .plus { font-size: 34px; }
.grid.small .card.add.ytadd .plus { font-size: 26px; padding: 4px 0; }
.grid.small .card.add b { font-size: 14px; }
.grid.small .card.add span { display: none; }
.grid.list .card { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; column-gap: 14px; padding-right: 10px; }
.grid.list .card:hover { transform: translate(-2px, -2px); }
.grid.list .card .art { width: 52px; height: 52px; aspect-ratio: auto; }
.grid.list .card .art .noart { font-size: 9px; padding: 3px; }
.grid.list .card .art .noart.gen { font-size: 17px; place-items: center; padding: 0; }
.grid.list .card .art .noart.gen svg { display: none; }
.grid.list .card .meta { padding: 6px 0; display: flex; align-items: baseline; gap: 16px; min-width: 0; }
.grid.list .card .t { font-size: 16px; flex: 0 1 auto; min-width: 0; }
.grid.list .card .a { margin-top: 0; flex: 1 1 auto; min-width: 0; }
.grid.list .card .sw { padding: 0; }
.grid.list .card .sw .cx { flex: 0 0 auto; min-width: 34px; }
.grid.list .card.game .sw .cx { min-width: 150px; }
.grid.list .mine-tag, .grid.list .yt, .grid.list .pbar, .grid.list .card.off .art::before, .grid.list .card.half .art::before { display: none; }
.grid.list .ed { width: 26px; height: 26px; right: 13px; top: 13px; opacity: 0; }
.grid.list .card:hover .ed { opacity: 1; }
.grid.list .pv { width: 32px; height: 32px; left: 10px; bottom: 10px; font-size: 12px; }
.grid.list .card.add { display: flex; min-height: 54px; flex-direction: row; justify-content: flex-start; gap: 14px; padding: 8px 16px; }
.grid.list .card.add .plus { font-size: 30px; }
.grid.list .card.add.ytadd .plus { font-size: 22px; padding: 0; }
.grid.list .card.add b { font-size: 18px; }
/* свои песни мышкой — новый порядок */
.card.mine[draggable="true"] { cursor: grab; }
.card.dragging { opacity: .35; }
.card.dropbefore { box-shadow: -5px 0 0 var(--acid); }
.card.dropafter { box-shadow: 5px 0 0 var(--acid); }
.grid.list .card.dropbefore { box-shadow: 0 -4px 0 var(--acid); }
.grid.list .card.dropafter { box-shadow: 0 4px 0 var(--acid); }

.lang { position: fixed; z-index: 4; top: 14px; right: 34px; display: flex; gap: 4px; align-items: center; }
.lang span, .lang button { font: inherit; font-size: 11px; letter-spacing: .12em; padding: 3px 7px; border: 1px solid var(--line); color: var(--mute); cursor: pointer; background: rgba(0,0,0,.5); font-variation-settings: "wdth" 100, "wght" 700; text-transform: uppercase; }
.lang span:hover, .lang button:hover { color: var(--paper); }
.lang span.on { background: var(--acid); color: var(--ink); border-color: var(--acid); }
/* программу допиливаем (это релиз, не бета) — баг-репорт на виду (Ваня 12.11: «а то он где-то внизу и не видно») */
.lang .beta { font-size: 11px; letter-spacing: .06em; padding: 3px 10px; margin-right: 14px; background: rgba(0,0,0,.55); border: 1px solid var(--line); color: var(--mute); text-decoration: none; white-space: nowrap; }
.lang .beta b { color: var(--paper); font-weight: normal; font-variation-settings: "wdth" 100, "wght" 700; }
.lang .beta:hover { border-color: var(--acid); color: var(--paper); }
.lang .beta:hover b { color: var(--acid); }
.lang button { margin-left: 10px; }
/* язык: кнопка «UA ▾» + список; внизу серая строка «переводы сделаны ИИ» */
.lang .lsel { position: relative; }
.lang .lsel .lcur { margin-left: 0; }
.lang .lsel.open .lcur { background: var(--acid); color: var(--ink); border-color: var(--acid); }
.lang .lmenu { display: none; position: absolute; top: calc(100% + 6px); right: 0; z-index: 10; min-width: 230px; max-height: calc(100vh - 70px); overflow-y: auto;
  padding: 4px 0; background: rgba(16,12,26,.97); border: 1px solid var(--line); box-shadow: 0 12px 34px rgba(0,0,0,.65); }
.lang .lsel.open .lmenu { display: block; }
/* первые окна (соглашение → игра → Mod Manager → папки): язык можно сменить прямо там — переключатель поверх затемнения (R1-05), остальное в шапке — нет */
body.booting .lang { z-index: 1001; }
body.booting .lang > :not(#lang) { visibility: hidden; }
.lang .li { display: flex; gap: 12px; align-items: baseline; padding: 7px 16px; font-size: 15px; color: var(--paper); cursor: pointer; white-space: nowrap;
  font-variation-settings: "wdth" 100, "wght" 500; }
.lang .li b { width: 22px; flex: none; font-size: 11px; letter-spacing: .1em; color: var(--mute); font-weight: normal; font-variation-settings: "wdth" 100, "wght" 700; }
.lang .li:hover { background: rgba(255,255,255,.08); }
.lang .li.on, .lang .li.on b { color: var(--acid); }
.lang .lnote { margin-top: 4px; padding: 8px 16px 6px; border-top: 1px solid var(--line); max-width: 270px; font-size: 12px; line-height: 1.35; color: var(--mute); white-space: normal; }
/* окно первого запуска: язык Windows — на всю ширину, остальные — сеткой */
.dlg-lang .dlg-btns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 1180px; }
.dlg-lang .dlg-btn { min-height: 52px; padding: 0 18px; white-space: nowrap; overflow: hidden; }
.dlg-lang .dlg-btn:first-child { grid-column: 1 / -1; min-height: 70px; font-size: clamp(22px, 1.9vw, 32px); }
.dlg-lang .lang-ai { margin-top: 14px; font: 14px var(--font); color: #8f8c99; }
@media (max-width: 1000px) { .dlg-lang .dlg-btns { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) { .dlg-lang .dlg-btns { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.note { position: fixed; z-index: 5; right: 34px; bottom: 30px; max-width: 440px; background: var(--paper); color: var(--ink); padding: 14px 18px; transform: translateY(30px); opacity: 0;
  pointer-events: none; transition: .25s; box-shadow: 0 8px 30px rgba(0,0,0,.5); font-size: 14px; line-height: 1.4; }
.note.show { opacity: 1; transform: translateY(0); }

/* ---------- где играет (Heat): 5 мест — гараж, город день / ночь, гонка день / ночь; цвет места, вкл — залит, выкл — контур ---------- */
.c-garage { --cc: var(--c-garage); } .c-cityDay { --cc: var(--c-cityDay); } .c-cityNight { --cc: var(--c-cityNight); } .c-raceDay { --cc: var(--c-raceDay); } .c-raceNight { --cc: var(--c-raceNight); }
.cx { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 26px; padding: 0 8px; border: 1px solid var(--cc); color: var(--cc); background: rgba(0,0,0,.35);
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-variation-settings: "wdth" 100, "wght" 700; cursor: pointer; user-select: none; opacity: .32; white-space: nowrap; }   /* выкл тусклее (Ваня 15.11: «не понятно» при .6) */
.cx svg { height: 14px; width: auto; flex: none; fill: currentColor; }
.cx b { font-weight: normal; font-style: italic; }
.cx.on { background: color-mix(in srgb, var(--cc) 22%, transparent); color: var(--cc); opacity: 1; }
.cx:hover { opacity: 1; box-shadow: 0 0 0 1px var(--paper); }

/* ---------- своя песня: панель справа ---------- */
.rp-dim { position: fixed; inset: 0; z-index: 6; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .2s; }
.rp-dim.show { opacity: 1; pointer-events: auto; }
.rpan { position: fixed; z-index: 7; top: 0; right: 0; bottom: 0; width: min(680px, 100vw); background: #0d0b15; border-left: 3px solid var(--acid);
  transform: translateX(105%); display: flex; flex-direction: column; }   /* 18.11 без выезда (было transition .25s): встает сразу, анимация — dialog.js hxPanel */
.rpan.show { transform: none; }
.rp-in { flex: 1; overflow-y: auto; padding: 30px 34px 20px; }
.rp-in::-webkit-scrollbar { width: 6px; } .rp-in::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); }
.rp-x { position: absolute; top: 14px; right: 18px; background: none; border: none; color: var(--mute); font-size: 22px; cursor: pointer; }
.rp-x:hover { color: var(--paper); }
.rp-h { font-size: 44px; line-height: .9; text-transform: uppercase; font-variation-settings: "wdth" 75, "wght" 700; font-style: italic; color: var(--acid); }
.btn.sm { font-size: 11px; padding: 8px 12px; }
.drop { margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 30px 20px; border: 2px dashed rgba(255,255,255,.25); cursor: pointer;
  text-align: center; transition: border-color .12s, background .12s; }
.drop b { font-size: 15px; letter-spacing: .06em; font-weight: normal; font-variation-settings: "wdth" 90, "wght" 600; color: #cfcfca; }
.drop:hover, .drop.over { border-color: var(--acid); background: rgba(255,45,123,.06); }
.drop.small { flex-direction: row; justify-content: space-between; padding: 10px 14px; margin-top: 16px; cursor: default; }
.drop.small b { font-size: 13px; color: var(--paper); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drop.small .btn { display: none; }
.rp-top { margin-top: 18px; display: grid; grid-template-columns: 132px 1fr; gap: 18px; align-items: start; }
.cov { position: relative; width: 132px; height: 132px; border: 1px solid var(--line); cursor: pointer; background: #15121f; }
.cov canvas { width: 100%; height: 100%; display: block; }
.cov.over { border-color: var(--acid); box-shadow: 0 0 0 2px var(--acid); }
.cov-h { margin-top: 6px; font-size: 11px; color: var(--mute); line-height: 1.35; }
.cov-h a { color: var(--acid); cursor: pointer; text-decoration: underline; }
.cov-h.cov-note { color: var(--paper); border-left: 2px solid var(--acid); padding-left: 6px; width: 132px; box-sizing: border-box; }   /* 17.11: обложка в мод не идет */
/* обложка: Залить / Сгенерировать / Удалить */
.cov-btns { display: flex; gap: 6px; width: 132px; margin-top: 8px; }
.cb { flex: 1; height: 30px; display: grid; place-items: center; padding: 0; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--paper); cursor: pointer; }
.cb svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cb:hover { border-color: var(--acid); color: var(--acid); }
.cb.del:hover { border-color: #ff3b3b; color: #ff3b3b; }
.rp-f { display: grid; grid-template-columns: 1fr; gap: 10px; }

   (пустой квадрат / зеленый с галочкой, как «Без диктора»); выше 100 % без защиты — желтое предупреждение. Блок вне .rp-f (там стили ломают ползунок) */
.rp-vol { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 16px; }
.rp-vol > small { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-right: 4px; }
.rp-vol input[type=range] { flex: 1 1 160px; min-width: 120px; height: 29px; margin: 0; accent-color: var(--acid); cursor: pointer; }
.rp-vol .vv { min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: normal; }
.rp-vol .vv.hot { color: var(--sun); }
.rp-vol .btn.sm { padding: 7px 12px; }
.rp-vol .ck { flex-basis: 100%; }
.ck { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.ck input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.ck i { flex: 0 0 auto; width: 18px; height: 18px; box-sizing: border-box; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.05); }
.ck input:checked + i { background: #1fd65f; border-color: #1fd65f; }
.ck input:checked + i::after { content: ""; width: 9px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.ck input:focus-visible + i { outline: 1px solid var(--acid); outline-offset: 2px; }
.ck span { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--paper); }
.rp-warn { margin: 8px 0 0; font-size: 12px; line-height: 1.4; color: var(--sun); }
.rp-warn:empty { display: none; }
.wave { position: relative; margin-top: 22px; height: 130px; background: rgba(255,255,255,.03); border: 1px solid var(--line); cursor: pointer; user-select: none; }   /* клик — слушать с этого места */
.wave canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.wv-ph { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; display: none; }
.wv-msg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); pointer-events: none; /* только надпись — мышь сквозь нее к GO / финишу (иначе над GO был крестик, 13.11) */ }
.parts { margin-top: 16px; }
.part { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--line); border-left: 4px solid var(--acid); }
.parts-note { margin: 2px 0 0; font-size: 12px; line-height: 1.35; color: var(--mute); }
.parts-note a { color: var(--acid); cursor: pointer; text-decoration: underline; white-space: nowrap; }
.part b { display: block; font-size: 17px; text-transform: uppercase; font-weight: normal; font-variation-settings: "wdth" 80, "wght" 700; }
.part span { display: block; margin-top: 2px; font-size: 12px; line-height: 1.35; color: var(--mute); }
.part em { font-style: normal; font-size: 13px; color: #cfcfca; white-space: nowrap; font-variant-numeric: tabular-nums; }
.part .pp { width: 42px; height: 42px; border: none; background: var(--acid); color: var(--ink); font-size: 15px; cursor: pointer; }
.part .pp.on { box-shadow: 0 0 0 2px #fff; }
/* 19.11 выезд из гаража «как в Unbound» (Ваня: «зум, нарастание, затухание… песня не цикличная, ждет загрузку — конец не логический»):
   фиолетовый флажок старта (тянуть, как GO; ← → 0,1 с), кусок = от флажка с запасом 60 с — правого края нет; ручки нарастания (в начале) и затухания (в конце запаса);
   зум — линейка, полоса всей песни, −/+/вся песня, колесо. Цвет — места «Гараж». Видно, только если песня играет в гараже */
.wave { cursor: crosshair; }
.wv-v { position: absolute; top: 0; bottom: 0; background: rgba(159,76,255,.13); border-left: 1px dashed rgba(159,76,255,.75); pointer-events: none; display: none; }
.wv-go { position: absolute; top: -8px; bottom: -8px; width: 3px; margin-left: -1px; background: var(--c-garage); cursor: grab; display: none; }   /* флажок старта — как GO в Unbound */
.wv-go b { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: var(--c-garage); color: #fff; font-size: 11px; padding: 1px 6px; letter-spacing: .08em;
  font-weight: normal; font-variation-settings: "wdth" 100, "wght" 700; white-space: nowrap; text-transform: uppercase; }
.wv-go b span { font-variant-numeric: tabular-nums; font-variation-settings: "wdth" 85, "wght" 600; }
.wv-go.l b { left: -1px; transform: none; } .wv-go.r b { left: auto; right: -1px; transform: none; }   /* у края — флажок внутрь волны */
.wv-go::after { content: ""; position: absolute; inset: 0 -10px; }   /* та же зона, что ловит mousedown (10 px) */
body.wv-drag, body.wv-drag * { cursor: grabbing !important; }
.wv-clip { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.wv-fr { position: absolute; inset: 0; width: 100%; height: 100%; display: none; } .wv-fr .dim { fill: rgba(0,0,0,.6); } .wv-fr .ln { fill: none; stroke: var(--c-garage); stroke-width: 2; vector-effect: non-scaling-stroke; }
.wv-fh { position: absolute; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; box-sizing: border-box; background: var(--c-garage); border: 2px solid #0b0b0b; cursor: ew-resize; z-index: 1; display: none; }
.wv-t { position: absolute; bottom: 4px; padding: 1px 5px; background: rgba(0,0,0,.78); color: #fff; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; transform: translateX(-50%); display: none; z-index: 2; }
.wv-rul { display: block; width: 100%; height: 18px; }
.wv-bar { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.wv-ov { position: relative; flex: 1; height: 28px; background: rgba(255,255,255,.03); border: 1px solid var(--line); user-select: none; }
.wv-ov.z { cursor: pointer; }
.wv-ov canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.wv-of { position: absolute; top: -1px; bottom: -1px; min-width: 6px; box-sizing: border-box; border: 2px solid var(--acid); background: rgba(255,0,128,.08); pointer-events: none; }
.wv-bar .cb { flex: 0 0 34px; height: 30px; }
.wv-hint { margin: 6px 0 0; font-size: 11px; line-height: 1.35; color: var(--mute); }
/* строка «Виїзд з гаража»: справа колонка как у кусков Unbound — подпись | поле 96 px; ниже «от → до» и «Авто» */
.part.v { grid-template-columns: 46px minmax(0, 1fr) 224px; border-left-color: var(--c-garage); }
.part.v .pp { background: var(--c-garage); color: #fff; }
.tt { display: grid; grid-template-columns: minmax(0, 1fr) 96px; column-gap: 10px; row-gap: 6px; align-items: center; }
.tt .tin { display: contents; }
.part .tt .tin b { grid-column: 1; justify-self: end; text-align: right; font-size: 12px; line-height: 1.2; letter-spacing: .02em; text-transform: none; color: var(--mute); font-weight: normal; font-variation-settings: normal; }
.part .tt .tin.main b { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-variation-settings: "wdth" 100, "wght" 700; color: #c9a4ff; }
.tt input { grid-column: 2; width: 100%; box-sizing: border-box; height: 30px; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--paper); font: inherit; font-size: 15px; padding: 0 9px;
  text-align: right; font-variant-numeric: tabular-nums; outline: none; }
.tt input:focus { border-color: var(--c-garage); }
.tt input.bad { border-color: #ff3b3b !important; }
.part .tt em { grid-column: 1; justify-self: end; text-align: right; font-size: 12px; line-height: 1.35; color: var(--mute); white-space: normal; font-variant-numeric: tabular-nums; }
.tt .btn.sm { grid-column: 2; padding: 7px 6px; }
.tt .btn.sm.on { border-color: var(--c-garage); background: rgba(159,76,255,.28); cursor: default; }   /* старт — авто: кнопка «нажата» */
/* 19.11 напоминание (Ваня: «чтоб люди не забывали проставлять»): песня в гараже, выезд еще не смотрели — фиолетовая точка на карандаше (в списке карандаш виден всегда),
   у раздела «Гараж» кнопка «Налаштувати виїзд · N» — по очереди; в редакторе выезд вспыхивает, когда до него дошли */
.card.vsn .ed::after { content: ""; position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--c-garage); box-shadow: 0 0 0 2px #0b0b0b; }
.grid.list .card.vsn .ed { opacity: 1; }
.sep .vsw { border-color: var(--c-garage); color: #e6d4ff; font-style: normal; }
.sep .vsw:hover { background: var(--c-garage); border-color: var(--c-garage); color: #fff; }
.sep .vsw i { margin-left: 8px; background: var(--c-garage); color: #fff; padding: 1px 6px; }
.sep .vsw:hover i { background: #fff; color: var(--c-garage); }
.part.v.flash, .wave.flash { animation: vsFlash 1.6s ease-out; }
@keyframes vsFlash { 0%, 45% { box-shadow: 0 0 0 2px var(--c-garage), 0 0 26px rgba(159,76,255,.55); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .part.v.flash, .wave.flash { animation: none; box-shadow: 0 0 0 2px var(--c-garage); } }
/* 19.11 «Старт гонки» (Ваня: «проделай все»; тест в игре v2 — попал): бирюзовый флажок дропа на волне, перед ним — 4 кадра заставки и отсчет
   (длины как src/Audio.cs Cuts), пунктир GO! — за 1,2 с до дропа; ручка нарастания (вправо — дольше, вниз — тише). Цвет — «Гонка» (циан).
   Видно, только если песня в гонке и стоит «Починати гонку з цієї пісні» */
.wv-rz { position: absolute; top: 0; bottom: 0; box-sizing: border-box; border-left: 1px dashed rgba(0,255,255,.55); background: rgba(0,255,255,.06); }
.wv-rz:nth-child(even) { background: rgba(0,255,255,.12); }
.wv-rz.cd { background: rgba(255,176,0,.13); border-left-color: rgba(255,176,0,.75); }
.wv-rz i { position: absolute; top: 3px; left: 4px; font-style: normal; font-size: 10px; letter-spacing: .06em; color: rgba(170,255,255,.9); white-space: nowrap; }
.wv-rz.cd i { color: #ffcf70; }
.wv-gs { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dotted rgba(255,255,255,.85); pointer-events: none; display: none; }
.wv-gs b { position: absolute; bottom: 3px; right: 3px; font-size: 10px; font-weight: normal; font-variation-settings: "wdth" 100, "wght" 700; letter-spacing: .06em; color: #fff; background: rgba(0,0,0,.7); padding: 0 3px; }
.wv-go.rg { background: var(--c-raceDay); } .wv-go.rg b { background: var(--c-raceDay); color: #0b0b0b; }
.wv-fh.rg { background: var(--c-raceDay); cursor: move; }
.wv-fr.rg .ln { stroke: var(--c-raceDay); }
.wv-cd { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; font-size: 58px; line-height: 1; color: #fff; text-shadow: 0 0 18px rgba(0,255,255,.7), 0 2px 0 #000;
  font-variation-settings: "wdth" 80, "wght" 800; }
.part.r { grid-template-columns: 46px minmax(0, 1fr) 224px; border-left-color: var(--c-raceDay); }
.part.r .pp { background: var(--c-raceDay); color: #0b0b0b; }
.part.r .tt .tin.main b { color: #8ff; }
.part.r .tt input:focus { border-color: var(--c-raceDay); }
.part.r .tt .btn.sm.on { border-color: var(--c-raceDay); background: rgba(0,255,255,.16); }
.part.r .ck { margin-top: 8px; }
.part.r.off .tt, .part.r.off > .pp { opacity: .3; pointer-events: none; }
/* напоминание старта — бирюзовая точка слева на карандаше (фиолетовая справа — выезд), у разделов гонки кнопка «Налаштувати старт · N» */
.card.gon .ed::before { content: ""; position: absolute; top: -4px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--c-raceDay); box-shadow: 0 0 0 2px #0b0b0b; }
.grid.list .card.gon .ed { opacity: 1; }
.sep .gow { border-color: var(--c-raceDay); color: #c8ffff; font-style: normal; }

.sep .gow i { margin-left: 8px; background: var(--c-raceDay); color: #0b0b0b; padding: 1px 6px; }
.sep .gow:hover i { background: #0b0b0b; color: var(--c-raceDay); }
.part.r.flash, .wave.gflash { animation: goFlash 1.6s ease-out; }
@keyframes goFlash { 0%, 45% { box-shadow: 0 0 0 2px var(--c-raceDay), 0 0 26px rgba(0,255,255,.45); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .part.r.flash, .wave.gflash { animation: none; box-shadow: 0 0 0 2px var(--c-raceDay); } }
.rp-row { display: flex; gap: 12px; padding: 16px 34px 22px; border-top: 1px solid var(--line); }

@media (max-width: 900px) { .app { grid-template-columns: 1fr; } .side { display: none; } .main { padding-left: 16px; padding-right: 16px; } }

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SR = 48000;   // звук для игры — 48 кГц (src/Audio.cs)
const AUDIO_EXT = [".mp3", ".wav", ".flac", ".ogg", ".oga", ".opus", ".m4a", ".aac"];
let S = null, tracks = [], songs = [], filter = "all";

// ---------- где играет (Heat): трек игры живет в одном месте (x.ctx), своя песня — в любых (флаги x.garage … x.raceNight) ----------
const CTX = ["garage", "cityDay", "cityNight", "raceDay", "raceNight"];
const ALL_ON = Object.fromEntries(CTX.map(c => [c, true]));
const CX_ICON = (() => {   // значки: гараж / город (дома) / гонка (флаг) + солнце (день) или месяц (ночь)
  const g = '<path fill-rule="evenodd" d="M8 1.5 1 6.2V15h14V6.2zM3.5 8h9v7h-9zM4.6 9.2h6.8v1.2H4.6zm0 2.3h6.8v1.2H4.6z"/>';
  const c = '<path fill-rule="evenodd" d="M1 15V7h4V3h5v4.5h5V15zM6.5 4.5h2v2h-2zm0 3.5h2v2h-2zm0 3.5h2v2h-2zM2.5 9H4v1.5H2.5zm0 3H4v1.5H2.5zM11.5 9.5h2V11h-2zm0 3h2V14h-2z"/>';
  const r = '<path d="M2.5 1h1.6v14H2.5zM5 2.2c2.8-1.4 4.8 1.4 9.5 0v6.6c-4.7 1.4-6.7-1.4-9.5 0z"/>';
  const sun = '<circle cx="18.6" cy="3" r="2.4"/>', moon = '<path d="M18.9.3a3 3 0 1 0 2.1 4.9 2.4 2.4 0 0 1-2.1-4.9z"/>';
  const w = (vb, b) => `<svg viewBox="${vb}" aria-hidden="true">${b}</svg>`;
  return { garage: w("0 0 16 16", g), cityDay: w("0 0 21.5 16", c + sun), cityNight: w("0 0 21.5 16", c + moon), raceDay: w("0 0 21.5 16", r + sun), raceNight: w("0 0 21.5 16", r + moon) };
})();
const ctxName = c => t("ctx_" + c);
const playsIn = (x, c) => x.mine ? !!x[c] : x.ctx === c && !!x.on;   // играет ли в месте c
const anyOn = x => x.mine ? CTX.some(c => x[c]) : !!x.on;
const allOn = x => x.mine ? CTX.every(c => x[c]) : !!x.on;
// чип места: с подписью (панель песни, трек игры) или только значок (плитка своей песни); attr — data-атрибут для клика
const cxChip = (c, on, label, attr) => `<span class="cx c-${c}${on ? " on" : ""}"${attr || ""} title="${esc(ctxName(c) + " · " + t("ctxTip"))}">${CX_ICON[c]}${label ? `<b>${esc(ctxName(c))}</b>` : ""}</span>`;

// ---------- связь с программой ----------
async function api(path, body, raw) {
  let r;
  try {
    r = await fetch(path, body === undefined ? {} : { method: "POST", body: raw ? body : JSON.stringify(body) });
  } catch (e) { throw { key: "net" }; }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (j && j.error) throw { key: j.error, arg: j.errorArg };
  if (!r.ok) throw { key: "crash", arg: "HTTP " + r.status };
  return j;
}
const errText = e => t("err_" + (e && e.key || "crash"), { a: e && e.arg || "" }) + (e && e.arg && !/\{a\}/.test(I18N.en["err_" + e.key] || "") && e.key === "crash" ? " (" + e.arg + ")" : "");
async function showError(e) {
  const v = await askYesNo({ title: t("failT"), html: `<p>${esc(errText(e))}</p>`, yes: t("close"), no: t("openLog") });   // формы баг-репорта у Heat пока нет — без bugHint
  if (!v) api("/api/open", { what: "log" }).catch(() => {});
}
function note(html) { const n = $("note"); n.innerHTML = html; n.classList.add("show"); clearTimeout(note.t); note.t = setTimeout(() => n.classList.remove("show"), 5000); }

// ссылки — в обычном браузере, не в окне программы
document.addEventListener("click", e => {
  const a = e.target.closest("a[href^='http']");
  if (!a) return;
  e.preventDefault(); openUrl(a.href);
});
// ссылка — в браузере по умолчанию через программу; программа не ответила — открываем сами
const openUrl = u => api("/api/url", { url: u }).catch(() => window.open(u, "_blank", "noopener"));
// ключ шифрования игры для Frosty Mod Manager — в окнах Frosty / ключа / выбора папки Mod Manager ({keyLink} в текстах).
// Heat: точной ссылки на страницу ключа пока нет (в Unbound была Nexus mods/97) — пока имя без ссылки
const KEY_LINK = '<a href="https://www.nexusmods.com/needforspeedheat/mods/74">NFS Heat Frosty Key ↗</a> (Nexus Mods: NFSHEAT.key → Frosty Mod Manager)';

// ---------- старт: язык → соглашение → игра → Mod Manager → подготовка ----------
async function boot() {
  try { S = await api("/api/state"); } catch (e) { await showError(e); return; }
  $("ver").textContent = S.version ? "v" + S.version : "";   // версия возле заголовка (Ваня 15.11), одна — из src/App.cs
  muteMark();
  if (I18N[S.lang]) setLang(S.lang);
  else {   // первый запуск: сверху крупно ВСЕГДА English (международный, Ваня 13.11 — не язык Windows), остальные — сеткой в порядке LANGS;
           // заголовок, подсказка и строка «переводы сделаны ИИ» — на том языке, на котором стоит выбор (мышь / стрелки)
    const win = "en", codes = [win, ...LANGS.map(([c]) => c).filter(c => c !== win)];
    const L = (c, k) => (I18N[c] && I18N[c][k]) || I18N.en[k];
    const v = await askYesNo({ title: L(win, "langT"), cls: "dlg-lang", html: `<p data-lp>${L(win, "langPick")}</p>`,
      buttons: codes.map((c, i) => ({ label: i ? LANG_NAMES[c] : LANG_NAMES[c] + " — " + L(c, "langGo"), val: c })),
      onOpen: box => {
        const back = box.closest(".dlg-back"), note = document.createElement("p");
        note.className = "lang-ai"; note.textContent = L(win, "aiNote");
        back.querySelector(".dlg-btns").after(note);
        back.querySelectorAll(".dlg-btn").forEach((b, i) => {
          b.lang = hl(codes[i]);
          const show = () => {
            back.querySelector(".dlg-title").textContent = L(codes[i], "langT");
            box.querySelector("[data-lp]").textContent = L(codes[i], "langPick"); note.textContent = L(codes[i], "aiNote");
            back.querySelector(".dlg").lang = hl(codes[i]);
          };
          b.addEventListener("focus", show); b.addEventListener("mouseenter", show);   // стрелки / Tab — focus, мышь — mouseenter
        });
      } });
    setLang(I18N[v] ? v : win);
    await api("/api/lang", { lang: LANG }).catch(() => {});
  }
  if (S.view) { if (S.view.sort) vs.sort = S.view.sort; if (S.view.view) vs.view = S.view.view; if (S.view.fold) fold = new Set(String(S.view.fold).split(",").filter(Boolean)); }   // вид и сортировка — из settings.json (P2-07)
  document.body.classList.add("booting");   // язык в шапке — поверх первых окон (R1-05); show() убирает
  if (!S.agreed) {
    if (!await ask(() => ({ title: t("agreeT"), html: t("agreeHtml"), yes: t("agreeYes"), no: t("agreeNo") }))) return quit();
    await api("/api/agree", {});
  }
  while (!S.game) {
    if (!await ask(() => ({ title: t("gameT"), html: t("gameHtml"), yes: t("pickFolder"), no: t("exit") }))) return quit();
    await pick("game");
  }
  while (!S.fmm || !S.key) {
    if (!S.fmm) {
      const v = await ask(() => ({ title: t("fmmT"), html: t("fmmHtml", { keyLink: KEY_LINK }) + `<p><small>${t("fmmFile")}</small></p>`, yes: t("pickFolder"), no: t("download") }));
      if (v) await pick("fmm"); else openUrl("https://github.com/HarGabt/FrostyToolsuite/releases");
    } else {
      const v = await ask(() => ({ title: t("keyT"), html: t("keyHtml", { keyLink: KEY_LINK }), yes: t("retry"), no: t("openFmm") }));
      if (!v) await api("/api/open", { what: "fmm" }).catch(showError);   // R1-03: не запустился — сказать
      S = await api("/api/search", {});
    }
  }
  if (!S.pathsOk) { if (!await confirmPaths()) return; }
  if (S.stale) { const ok = await runJob("/api/prepare", S.ready ? "prepT" : "prepT", !S.ready); if (!ok && !S.ready) return; S = await api("/api/state"); }
  show();
  if (!S.musicTold) { await musicInfo(); api("/api/music/told", {}).catch(() => {}); }
  booted = true; syncMusic();
}
// окно «Пісні з папки»: как класть песни в Music (после первой подготовки и по кнопке «?»)
async function musicInfo() {
  if (await askYesNo({ title: t("musicT"), html: t("musicHtml", { mine: t("secMine"), add: t("addSong") }), yes: t("musicOk"), no: t("musicOpen"), tall: true }) === false)
    api("/api/open", { what: "music" }).catch(() => {});
}
// окно, которое переводится на лету: f() строит {title, html, yes, no} через t(); язык сменили на первых экранах — dialog.js зовет f() снова (R1-05)
const ask = f => askYesNo(Object.assign(f(), { re: f }));
// выбор папки прямо в окне программы (системное окно выбора открывалось позади окна программы)
async function pick(what) {
  let cur = "", valid = false, reload = null;
  const isGame = what === "game";
  const hint = () => t(isGame ? "pickGameHint" : "pickFmmHint", { keyLink: KEY_LINK });
  const ok = await askYesNo({
    title: t(isGame ? "gameT" : "fmmT"), yes: t("pickThis"), no: t("cancel"),
    re: () => ({ title: t(isGame ? "gameT" : "fmmT"), yes: t("pickThis"), no: t("cancel") }),
    onRelang: back => { back.querySelector("[data-hint]").innerHTML = hint(); if (reload) reload(); },
    html: `<p data-hint>${hint()}</p>
      <div class="fp-path"><button data-up title="..">↑</button><input data-in spellcheck="false"><button data-go>→</button></div>
      <div class="fp-list" data-list></div><div class="fp-st" data-st></div>`,
    onOpen: (box, done) => {
      const inp = box.querySelector("[data-in]"), list = box.querySelector("[data-list]"), st = box.querySelector("[data-st]");
      let parent = null;
      const load = async path => {
        let r; try { r = await api("/api/dirs", { path }); } catch (e) { st.textContent = errText(e); return; }
        cur = r.path; parent = r.parent; inp.value = r.missing || r.path;   // R1-02: путь, которого нет, не стираем
        valid = !!(isGame ? r.game : r.fmm);
        st.className = "fp-st " + (valid ? "ok" : "no");
        st.textContent = r.missing ? t("fpNone") : !r.path ? t("fpPlaces") : valid ? t(isGame ? "fpOkGame" : "fpOkFmm") : (r.denied ? t("fpDenied") : t("fpNo"));
        list.innerHTML = "";
        for (const d of r.dirs) {
          const b = document.createElement("button"), hit = isGame ? d.game : d.fmm;
          b.textContent = (hit ? "✓ " : "") + (d.kind ? t("place_" + d.kind) : d.name); b.title = d.path; if (hit) b.className = "hit";   // R1-07
          b.onclick = () => load(d.path);
          list.appendChild(b);

// задание программы (подготовка / сборка) с полосой прогресса; true — успех
async function runJob(path, titleKey, first) {
  let j, stopping = false, asking = false;
  try { j = await api(path, {}); } catch (e) { await showError(e); return false; }
  // сборку можно остановить (Ваня 13.11): «Стоп» / Esc -> «Зупинити?» (по умолчанию «Продовжити») -> программа гасит рабочий процесс; мод в Mods не тронут
  const stop = path === "/api/build" ? { label: t("ytStop"), fn: async () => {
    if (asking || stopping) return;
    asking = true;
    const ok = await askYesNo({ title: t("buildStopT"), html: t("buildStopHtml"), yes: t("ytStop"), no: t("buildGoOn"), start: 1 });
    asking = false;
    if (!ok || stopping) return;
    stopping = true; updateBusy(t("buildStopping"), -1);
    api("/api/job/stop", {}).catch(() => {});
  } } : null;
  showBusy(t(titleKey), first ? t("prepFirst") : "", stop);
  while (!j.done) {
    await new Promise(r => setTimeout(r, 400));
    try { j = await api("/api/job"); } catch (e) {
      // ошибка задания приходит броском из api() ({key: job.error}), а не в j — свои случаи разбираем здесь (13.11: «Стоп» показывал err_stopped)
      hideBusy();
      if (e && e.key === "stopped") { note(t("buildStopped")); return false; }
      if (e && e.key === "vcMissing") return (await vcMissing()) ? runJob(path, titleKey, first) : false;
      await showError(e); return false;
    }
    if (!j) break;
    const [key, ...rest] = (j.step || "").split(" ");
    if (key && !stopping) updateBusy(t("step_" + key, { a: rest.join(" ") }), j.pct);
  }
  hideBusy();
  if (j && j.error === "stopped") { note(t("buildStopped")); return false; }
  if (j && j.error === "vcMissing") return (await vcMissing()) ? runJob(path, titleKey, first) : false;
  if (j && j.error) { await showError({ key: j.error, arg: j.errorArg }); return false; }
  runJob.result = j && j.result;
  return true;
}

const dropSide = (c, e) => { const r = c.getBoundingClientRect(); return vs.view === "list" ? e.clientY > r.top + r.height / 2 : e.clientX > r.left + r.width / 2; };
$("grid").addEventListener("dragstart", e => {

$("grid").addEventListener("dragover", e => {

$("grid").addEventListener("drop", async e => {

async function dropAny(e) {
  if (rp.open || document.querySelector(".dlg-back.show")) return;
  const all = [...(e.dataTransfer.files || [])];
  const files = all.filter(f => AUDIO_EXT.includes((f.name.match(/\.[^.]+$/) || [""])[0].toLowerCase()) || (f.type || "").startsWith("audio/"));
  if (files.length === 1) { openSong(null, files[0]); return; }
  if (files.length > 1) { addFiles(files); return; }
  const txt = all.find(f => /\.(txt|csv|tsv)$/i.test(f.name));
  if (txt) { const s = await readTxt(txt); if (spCsv(s)) spAsk(s); else ytAsk(s); return; }   // .csv-выгрузка плейлиста — в окно Spotify
  const u = e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain") || "";
  const links = u.match(YT_RE) || [];
  if (links.some(isSp) && !links.some(isYt)) spAsk(u);   // ссылку Spotify — сразу в окно Spotify
  else if (links.some(isLink)) ytAsk(u);
}
// несколько файлов: как импорт из папки Music — имена из тегов / имени файла, играет везде, обложка нарисована, файл — в Music\<номер>\
async function addFiles(list) {
  if (playing) stopPreview();
  showBusy(t("musicImpT"), "");
  let added = 0; const bad = [];
  for (let i = 0; i < list.length; i++) {
    const f = list[i];
    updateBusy(t("musicStep", { n: i + 1, m: list.length, a: f.name }), 100 * i / list.length);
    try {
      const buf = await f.arrayBuffer(), tg = id3(buf), a = await decode(buf);
      let [artist, title] = parseName(f.name);
      if (tg.title) { artist = tg.artist || ""; title = tg.title; }
      const res = await api("/api/song/upload?name=" + encodeURIComponent(f.name), toPcm(a).buffer, true);
      await api("/api/song/cover?id=" + encodeURIComponent(res.id), await coverPng(null, title, artist), true);
      await api("/api/song/save", Object.assign({ id: res.id, title, artist }, ALL_ON));
      await api("/api/music/put?id=" + encodeURIComponent(res.id) + "&name=" + encodeURIComponent(f.name), f, true);
      added++;
    } catch (er) { bad.push(f.name); }
  }
  hideBusy();
  try { S = await api("/api/state"); tracks = S.tracks; songs = S.songs; render(); stats(); } catch (er) {}
  const msg = [];
  if (added) msg.push(t("musicAdded", { n: added, build: t("build") }));
  if (bad.length) msg.push(esc(t("musicFail", { a: bad.join(", ") })));
  if (msg.length) note(msg.join("<br>"));
}

async function build() {
  if (rp.open) return;
  // место, где ничего не включено (ни треков игры, ни своих), сборка вернет треки игры (Worker.Build: пустой список ломает музыку) — сказать заранее
  const empty = CTX.filter(c => !tracks.some(x => x.ctx === c && x.on) && !songs.some(s => s[c]));
  if (empty.length && !await askYesNo({ title: t("ctxEmptyT"), html: t("ctxEmptyHtml", { list: empty.map(c => esc(ctxName(c))).join(", ") }), yes: t("yes"), no: t("no") })) return;
  // 19.11 (Ваня: «чтоб люди не забывали»): песни гаража, где выезд еще не смотрели, — напомнить. «Зібрати так» — авто-старт; Esc — ничего не делать
  const vn = songs.filter(vsNeed).length;
  if (vn) {
    const a = await askYesNo({ title: t("vsAskT"), html: t("vsAskHtml", { n: vn }), buttons: [{ label: t("vsAskYes"), val: "walk" }, { label: t("vsAskNo"), val: "build" }] });
    if (a === "walk") { vsWalk(); return; }
    if (a !== "build") return;
  }
  // 19.11: песни гонки, где старт не смотрели, — без своего вступления (гонку они не открывают); напомнить так же
  const gn = songs.filter(goNeed).length;
  if (gn) {
    const a = await askYesNo({ title: t("goAskT"), html: t("goAskHtml", { n: gn }), buttons: [{ label: t("goAskYes"), val: "walk" }, { label: t("goAskNo"), val: "build" }] });
    if (a === "walk") { vsWalk("go"); return; }
    if (a !== "build") return;
  }
  if (build.busy) return;   // двойной клик по пункту меню — одна сборка
  build.busy = true;
  try {
    if (await runJob("/api/build", "buildT")) {
      const res = runJob.result || {};
      // сколько треков в каждом месте после сборки (треки игры + свои; пустое место — треки игры назад) — перед строкой с путем
      const cnt = `<p>${t("builtCnt")} ` + CTX.map(c => `${esc(ctxName(c))} <b>${res[c] ?? "?"}</b>`).join(" · ") + ` · ${esc(t("secMine"))} <b>${res.songs ?? 0}</b></p>`;
      let html = t("builtHtml", { path: esc(res.path || "") }); const k = html.lastIndexOf("<p><small>");
      html = k >= 0 ? html.slice(0, k) + cnt + html.slice(k) : html + cnt;
      const open = await askYesNo({ title: t("builtT"), html, yes: t("openFmm"), no: t("close") });
      await askYesNo({ title: t("offT"), html: t("offHtml"), yes: t("offYes"), no: null });
      if (open) api("/api/open", { what: "fmm" }).catch(showError);   // R1-03
    }
  } finally { build.busy = false; }
}

// На всю высоту окна программы, но только видимой на экране части (окно бывает выше экрана или сдвинуто за край — Ваня: «вылазит за экран»).
// Окно целиком на экране — это просто 100% высоты. Пересчет при изменении размера.
function fitThanks(back) {
  const fit = () => {
    if (!back.isConnected) { removeEventListener("resize", fit); return; }

async function syncMusic() {

    const todo = r.todo.filter(x => !musicBad.has(x.src + "|" + x.asig + "|" + x.isig));
    let added = 0; const bad = [];
    if (todo.length) {

function ytKey(u) {   // одна песня / плейлист под разными ссылками (music. / www. / youtu.be, &list=, &t=, &si=) — один ключ

function ytParse(text) {   // текст (вставка / .txt) -> {rows: [{url, title, artist}], skip: кусков без ссылки YouTube}
  const rows = []; let skip = 0;
  const cyr = s => /[Ѐ-ӿ�]/.test(s);   // кириллица / битые знаки (не та кодировка) — поле не берем, имя с YouTube
  for (let rec of String(text || "").replace(/^﻿/, "").split(/[;\r\n]+/)) {
    rec = rec.trim();
    if (!rec || rec.startsWith("#") || rec.startsWith("//")) continue;   // пусто / комментарий
    const links = (rec.match(YT_RE) || []).map(u => u.replace(/[).]+$/, "")).filter(isLink);
    if (!links.length) { skip++; continue; }                               // заголовок, текст, чужая ссылка
    if (links.length > 1) { links.forEach(url => rows.push({ url, title: "", artist: "" })); continue; }   // несколько ссылок подряд — без имен

async function readTxt(f) {   // .txt из Блокнота: UTF-8, UTF-16 (с BOM) или старая латинская кодировка Windows (польская — 1250)
  const b = new Uint8Array(await f.arrayBuffer());
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder("utf-16le").decode(b);
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder("utf-16be").decode(b);
  try { return new TextDecoder("utf-8", { fatal: true }).decode(b); }
  catch (e) { return new TextDecoder(LANG === "pl" ? "windows-1250" : "windows-1252").decode(b); }
}

// .csv — выгрузка плейлиста (запасной путь, Ваня 16.11: «это как альтернативный вариант»; Ctrl+A в Spotify у него не выделяет).
// Exportify: «Track URI», «Track Name», «Artist Name(s)», «Duration (ms)»; другие сервисы — «Track name», «Artist name» (без длины).
// Имена и длина уже в файле — сразу строки и поиск на YT Music, без запросов к Spotify. null — не похоже на список песен.
function csvRows(text) {   // CSV с кавычками («A, B», "" внутри); разделитель , ; или Tab — какой чаще в заголовке
  text = String(text || "").replace(/^﻿/, "");
  const head = text.split(/\r?\n/)[0] || "";
  const sep = [",", ";", "\t"].sort((a, b) => head.split(b).length - head.split(a).length)[0];
  const out = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; continue; }
    if (c === '"') q = true;
    else if (c === sep) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); f = ""; if (row.length > 1 || row[0]) out.push(row); row = []; }
    else f += c;
  }
  if (f || row.length) { row.push(f); if (row.length > 1 || row[0]) out.push(row); }
  return out;
}
function spCsv(text) {
  if (/youtube\.com|youtu\.be/i.test(text || "")) return null;   // .txt со ссылками YouTube («Назва,Виконавець,Посилання») — это список YouTube
  const lines = csvRows(text); if (lines.length < 2) return null;
  const h = lines[0].map(x => x.trim().toLowerCase());
  const col = re => h.findIndex(x => re.test(x));
  // исполнитель: сначала «Artist Name(s)» — в Exportify раньше нее идет «Artist URI(s)», она тоже на «artist» (16.11, файл Вани)
  const cu = col(/track uri|spotify.*(uri|id)|^uri$/), ct = col(/track name|^name$|^title$|^song|^track$/), cd = col(/duration/);
  let ca = col(/artist name/); if (ca < 0) ca = col(/^artists?$/); if (ca < 0) ca = col(/^artist(?!.*\b(uri|id)\b)/);
  if (ct < 0 || ca < 0) return null;
  const rows = [];
  for (const r of lines.slice(1)) {
    const title = (r[ct] || "").trim();
    const m = (cu >= 0 ? r[cu] || "" : "").match(/([A-Za-z0-9]{22})\s*$/);
    if (!title) { if (m) rows.push({ sp: m[1], title: "", artist: "", dur: 0, hidden: true }); continue; }   // скрыта в стране: без имени и в выгрузке — красной строкой, как у ссылки
    const d = cd >= 0 ? (r[cd] || "").trim() : ""; let dur = 0;
    if (/^\d+:\d\d$/.test(d)) { const [a, b] = d.split(":"); dur = +a * 60 + +b; } else if (+d > 0) dur = +d > 3600 ? Math.round(+d / 1000) : Math.round(+d);   // мс / с / м:сс
    rows.push({ sp: m ? m[1] : "", title, artist: (r[ca] || "").replace(/\s*;\s*/g, ", ").trim(), dur });

}
